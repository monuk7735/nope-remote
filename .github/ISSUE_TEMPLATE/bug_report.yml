name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please make sure to search existing issues before submitting a new one.

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which version of Nope Remote are you running? (e.g., 2.4)
      placeholder: "2.4"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: What Android version is your device running? (e.g., Android 14)
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Phone Model
      description: Which phone model are you using? (e.g., Xiaomi 11T Pro, Redmi Note 13)
      placeholder: "Xiaomi 11T Pro"
    validations:
      required: true

  - type: dropdown
    id: ir-blaster
    attributes:
      label: IR Blaster Type
      description: Does your device have a built-in infrared blaster?
      options:
        - "Built-in IR blaster"
        - "External USB-C IR blaster"
        - "External 3.5mm headphone jack IR blaster"
        - "No IR blaster (Testing UI/Macros only)"
    validations:
      required: true

  - type: textarea
    id: target-device
    attributes:
      label: Target Appliance
      description: If applicable, what appliance were you trying to control? (e.g., Samsung Smart TV, Daikin AC)
      placeholder: "Brand: Samsung, Type: TV, Model: QN90A"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explain the exact steps to reproduce the issue.
      placeholder: |
        1. Open the app
        2. Tap '+' to add a remote
        3. Select TV -> Brand
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat or Screenshots
      description: Paste any relevant log output or drag and drop screenshots/screen recordings here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I am using the latest available version of the app.
          required: true

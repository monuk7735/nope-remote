name: PR Build Debug APK

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    environment: pr-review

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools via mise
        uses: jdx/mise-action@v2

      - name: Build Debug APK
        run: mise run build

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NopeRemote-PR-${{ github.event.pull_request.number }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
